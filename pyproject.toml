[tool.poetry]
name = "project-name"
version = "0.1.0"
description = "A simple project"
authors = ["username <email@email.com>"]
license = "MIT"
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = ">=3.11,<4"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
langchain-openai = "^1.2.2"
langchain = "^1.3.4"
httpx = "^0.28.1"
punq = "^0.7.0"
fastapi = {extras = ["standart"], version = "^0.136.3"}
uvicorn = "^0.49.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
